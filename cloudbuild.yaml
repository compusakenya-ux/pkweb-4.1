# ============================================================================
# Google Cloud Build CI/CD Pipeline — SENA 3D Landing & Meta WhatsApp Service
# ============================================================================
steps:
  # 1. Sync 3D High-Clarity Visual Assets to Google Cloud Storage (GCS) Bucket
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'sync-3d-assets-to-gcs'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Syncing 3D visual assets to gs://${_GCS_BUCKET}/assets..."
        gcloud storage cp public/assets/* gs://${_GCS_BUCKET}/assets/ --cache-control="public, max-age=31536000, immutable" || true

  # 2. Build Container Image for Google Cloud Run
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-container-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest'
      - '.'

  # 3. Push Image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-to-artifact-registry'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}'

  # 4. Deploy Service to Google Cloud Run with Secret Manager bindings
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_REGION},GCS_ASSETS_BUCKET=${_GCS_BUCKET}'
      - '--set-secrets=META_WHATSAPP_ACCESS_TOKEN=meta-whatsapp-token:latest,META_WEBHOOK_VERIFY_TOKEN=meta-webhook-verify:latest,META_APP_SECRET=meta-app-secret:latest'
      - '--quiet'

substitutions:
  _REGION: 'africa-south1'
  _ARTIFACT_REPO: 'sena-containers'
  _SERVICE_NAME: 'sena-3d-landing'
  _GCS_BUCKET: 'sena-mobility-3d-assets-prod'

options:
  logging: CLOUD_LOGGING_ONLY
